name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22   # jsdom 30 needs >= 22.22.2; the render tests use it
          cache: npm
      - run: npm ci
      - run: npx tsc
      - run: npm test
